<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDI-Telopper ブラウザーモニター</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e151d;color:#eff5fa;font:16px system-ui,sans-serif}
header,main{padding:16px 24px}h1{font-size:24px;margin:0 0 8px}h2{font-size:20px}p{margin:8px 0;color:#c7d4df}
button,select{font:inherit;background:#26394b;color:#fff;border:1px solid #64829a;border-radius:5px;padding:8px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid #f4c65b}button:disabled{opacity:.45;cursor:default}
#connection{color:#f4c65b}#grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tile{background:#182531;border:1px solid #455b6e;border-radius:8px;overflow:hidden}.tile>button{width:100%;text-align:left;border:0;border-radius:0;display:flex;justify-content:space-between;gap:12px}
.tile small{font-size:13px}.screen{aspect-ratio:16/9;background-color:#293541;background-image:linear-gradient(45deg,#344350 25%,transparent 25%,transparent 75%,#344350 75%),linear-gradient(45deg,#344350 25%,transparent 25%,transparent 75%,#344350 75%);background-size:24px 24px;background-position:0 0,12px 12px}
iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}.tile.expanded{grid-column:1/-1}.stale .screen{opacity:.45}
#review{margin-top:24px;border-top:1px solid #455b6e;padding-top:8px}.review-layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2fr);gap:16px}
#list{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:12px}#list button{text-align:left;font-size:14px}#list button[aria-pressed=true]{border-color:#f4c65b;background:#354b60}
#details{background:#182531;padding:12px;border-radius:8px}#details .screen{margin-top:10px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.training{color:#ffe17a}
@media(max-width:800px){#grid,.review-layout{grid-template-columns:1fr}header,main{padding:12px}.tile.expanded{grid-column:auto}}
</style>
</head>
<body>
<header><h1>CDI-Telopper ブラウザーモニター <small>無音・確認専用</small></h1>
<p>OBS向け各出力の現在の字幕です。枠の見出しをクリックすると拡大します。地震・火山は共通出力です。</p>
<div id="connection" role="status">接続を確認中…</div></header>
<main><div id="grid"></div>
<section id="review"><h2>受信済み電文の個別確認（送出しません）</h2>
<p>この起動中に確認画面へ登録された最新500件。訓練も含みます。過去の内容であり、現在発表中とは限りません。</p>
<div class="review-layout"><div><label>情報種別 <select id="filter"><option value="">すべて</option><option value="Quake">地震</option><option value="Eew">EEW</option><option value="Tsunami">津波</option><option value="WeatherWarning">気象</option><option value="Volcano">火山</option></select></label><div id="list"></div></div>
<div id="details"><p id="selection" role="status">一覧から電文を選択してください。</p><div class="toolbar"><button id="previous" disabled>前ページ</button><span id="page"></span><button id="next" disabled>次ページ</button></div><div class="screen"><iframe id="review-frame" title="選択電文の確認（送出なし）"></iframe></div></div></div></section>
</main><script src="/assets/monitor.js"></script></body></html>
